name: CI - Build

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      # Optional: keep build output as an artifact
      # - name: Upload dist artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: dist
      #     path: dist

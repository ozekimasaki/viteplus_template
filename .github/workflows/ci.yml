name: CI - Build

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run CI task
        run: vp run ci

      # Optional: keep build output as an artifact
      # - name: Upload dist artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: dist
      #     path: dist
